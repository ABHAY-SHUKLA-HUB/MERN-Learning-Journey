<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card Grid</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Our Products</h1>
        <p>Responsive Product Grid using CSS Grid</p>
    </header>
    <section class="container">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=600" alt="Laptop">
            <h2>Laptop</h2>
            <p>Powerful laptop for coding and productivity.</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600" alt="Phone">
            <h2>Smart Phone</h2>
            <p>Latest smartphone with amazing camera.</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600" alt="Headphones">
            <h2>Headphones</h2>
            <p>Wireless noise cancelling headphones.</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600" alt="Watch">
            <h2>Smart Watch</h2>
            <p>Track your fitness and notifications.</p>
            <button>Buy Now</button>
        </div>
    </section>
</body>

</html>
