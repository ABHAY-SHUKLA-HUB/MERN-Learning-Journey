<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to CSS Grid</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <h1>Introduction to CSS Grid</h1>

    <p>
        CSS Grid is a two-dimensional layout system
        used to arrange items into rows and columns.
    </p>

</header>

<section class="container">

    <div class="box">1</div>

    <div class="box">2</div>

    <div class="box">3</div>

    <div class="box">4</div>

    <div class="box">5</div>

    <div class="box">6</div>

</section>

</body>

</html>
