<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Width & Height</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>CSS WIDTH & HEIGHT</h1>
        <p>Width and Height control the size of HTML elements.</p>
    </header>
    <main>
        <section class="size-section">
            <h2>Fixed Width & Height</h2>
            <div class="box fixed">
                Fixed Size Box
            </div>
        </section>
        <section class="size-section">
            <h2>Percentage Width</h2>
            <div class="container">
                <div class="box percent">
                    Width 50%
                </div>
            </div>
        </section>
        <section class="size-section">
            <h2>Auto Width</h2>
            <div class="box auto">
                Width Auto
            </div>
        </section>
        <section class="size-section">
            <h2>Maximum Width</h2>
            <div class="box max-width">
                Max Width Example
            </div>
        </section>
    </main>
</body>
</html>
