<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Design</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Responsive Website</h1>
        <p>Mobile, Tablet and Desktop Friendly</p>
    </header>

    <main>

        <section class="hero">

            <div class="hero-content">

                <h2>Build Responsive Websites</h2>

                <p>
                    Create websites that look great on
                    every screen size.
                </p>

                <button>Get Started</button>

            </div>

            <div class="hero-image">

                <img
                    src="https://picsum.photos/id/1/800/600"
                    alt="Workspace"
                >

            </div>

        </section>

        <section class="cards">

            <div class="card">
                <h3>Mobile</h3>
                <p>
                    Optimized for small screens.
                </p>
            </div>

            <div class="card">
                <h3>Tablet</h3>
                <p>
                    Comfortable layout for tablets.
                </p>
            </div>

            <div class="card">
                <h3>Desktop</h3>
                <p>
                    Full layout for large screens.
                </p>
            </div>

        </section>

    </main>

</body>

</html>
