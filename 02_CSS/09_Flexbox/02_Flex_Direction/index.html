<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Direction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
    <h1>FLEX DIRECTION</h1>
    <p>
        The flex-direction property defines the direction of flex items.
    </p>
</header>
<main>
<section class="container">
    <h2>Row</h2>
    <div class="flex-container row">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
    </div>
    <h2>Column</h2>
    <div class="flex-container column">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
    </div>
    <h2>Row Reverse</h2>
    <div class="flex-container row-reverse">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
    </div>
    <h2>Column Reverse</h2>
    <div class="flex-container column-reverse">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
    </div>
</section>
</main>
</body>
</html>
