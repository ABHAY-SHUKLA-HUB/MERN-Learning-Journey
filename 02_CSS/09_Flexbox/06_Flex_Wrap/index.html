<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Wrap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <h1>FLEX WRAP</h1>
    <p>Learn how flex items wrap when there is not enough space.</p>
</header>

<main>

<section class="container">

    <h2>Nowrap (Default)</h2>

    <div class="flex-container nowrap">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>
    <h2>Wrap</h2>
    <div class="flex-container wrap">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>
    <h2>Wrap Reverse</h2>
    <div class="flex-container wrap-reverse">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>
</section>
</main>
</body>
</html>
