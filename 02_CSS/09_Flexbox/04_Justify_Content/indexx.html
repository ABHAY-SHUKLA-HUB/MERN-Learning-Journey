<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justify Content</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
    <h1>JUSTIFY CONTENT</h1>
    <p>
        Justify Content aligns flex items along the Main Axis.
    </p>
</header>
<main>
<section class="container">
    <h2>Flex Start</h2>
    <div class="flex-container start">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
    <h2>Center</h2>
    <div class="flex-container center">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
    <h2>Flex End</h2>
    <div class="flex-container end">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
    <h2>Space Between</h2>
    <div class="flex-container between">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
    <h2>Space Around</h2>
    <div class="flex-container around">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
    <h2>Space Evenly</h2>
    <div class="flex-container evenly">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
</section>
</main>
</body>
</html>
