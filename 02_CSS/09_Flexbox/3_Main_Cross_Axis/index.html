<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Axis & Cross Axis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
    <h1>MAIN AXIS & CROSS AXIS</h1>
    <p>
        Learn how Flexbox uses two invisible axes.
    </p>
</header>
<main>
<section class="container">
    <h2>Flex Direction : Row</h2>
    <div class="flex-container row">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
    <h2>Flex Direction : Column</h2>
    <div class="flex-container column">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
</section>
</main>
</body>
</html>
