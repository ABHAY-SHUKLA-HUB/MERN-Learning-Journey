<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gap & Flex Item Properties</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header class="header">
    <h1>GAP & FLEX ITEM PROPERTIES</h1>
    <p>Learn Gap, Row Gap, Column Gap, Order, Flex Grow, Flex Shrink, Flex Basis and Align Self.</p>
</header>
<main>

<section class="container">
    <h2>Gap</h2>
    <div class="flex-container gap-box">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
    <h2>Order</h2>
    <div class="flex-container">
        <div class="box first">1</div>
        <div class="box second">2</div>
        <div class="box third">3</div>
    </div>
    <h2>Flex Grow</h2>
    <div class="flex-container">
        <div class="box">1</div>
        <div class="box grow">2</div>
        <div class="box">3</div>
    </div>
    <h2>Flex Shrink</h2>
    <div class="flex-container shrink-container">
        <div class="box no-shrink">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
    <h2>Flex Basis</h2>
    <div class="flex-container">
        <div class="box basis">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
    <h2>Align Self</h2>
    <div class="flex-container align-container">
        <div class="box">1</div>
        <div class="box self">2</div>
        <div class="box">3</div>
    </div>
</section>
</main>
</body>
</html>
