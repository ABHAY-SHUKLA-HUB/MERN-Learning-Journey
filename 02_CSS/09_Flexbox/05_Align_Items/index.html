<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Align Items</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">

    <h1>ALIGN ITEMS</h1>
    <p>
        Align Items positions flex items on the Cross Axis.
    </p>
</header>
<main>
<section class="container">
    <h2>Flex Start</h2>
    <div class="flex-container start">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
    <h2>Center</h2>
    <div class="flex-container center">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
    <h2>Flex End</h2>
    <div class="flex-container end">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
    <h2>Stretch</h2>
    <div class="flex-container stretch">
        <div class="box no-height">1</div>
        <div class="box no-height">2</div>
        <div class="box no-height">3</div>
    </div>
</section>
</main>
</body>
</html>
