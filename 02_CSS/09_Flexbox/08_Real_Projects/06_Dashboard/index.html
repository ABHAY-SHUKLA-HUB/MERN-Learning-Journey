<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dashboard">
    <aside class="sidebar">
        <h2>MERN</h2>
        <ul>
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Students</a></li>
            <li><a href="#">Courses</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
    </aside>
    <main class="main-content">
        <header class="topbar">
            <h1>Dashboard</h1>
            <button>Profile</button>
        </header>
        <section class="cards">
            <div class="card">
                <h2>1200</h2>
                <p>Students</p>
            </div>
            <div class="card">
                <h2>35</h2>
                <p>Courses</p>
            </div>
            <div class="card">
                <h2>150</h2>
                <p>Projects</p>
            </div>
            <div class="card">
                <h2>15</h2>
                <p>Teachers</p>
            </div>
        </section>
    </main>
</div>
</body>
</html>
