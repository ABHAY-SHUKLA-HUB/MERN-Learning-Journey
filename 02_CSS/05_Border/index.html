<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Border</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>CSS BORDER</h1>
        <p>
            Borders are used to create outlines around HTML elements.
        </p>
    </header>
    <main>
        <section class="border-section">
            <h2>Different Border Styles</h2>
            <div class="box solid">
                Solid Border
            </div>
            <div class="box dashed">
                Dashed Border
            </div>
            <div class="box dotted">
                Dotted Border
            </div>
            <div class="box double">
                Double Border
            </div>
            <div class="box rounded">
                Rounded Border
            </div>
        </section>
    </main>
</body>
</html>
