<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>CSS DISPLAY PROPERTY</h1>
        <p>Display property controls how elements appear on a webpage.</p>
    </header>
    <main>
        <section class="display-section">
            <h2>Block Elements</h2>
            <div class="box block">Block 1</div>
            <div class="box block">Block 2</div>
        </section>
        <section class="display-section">
            <h2>Inline Elements</h2>
            <span class="box inline">HTML</span>
            <span class="box inline">CSS</span>
            <span class="box inline">JavaScript</span>
        </section>
        <section class="display-section">
            <h2>Inline-Block Elements</h2>
            <div class="box inline-block">Box 1</div>
            <div class="box inline-block">Box 2</div>
            <div class="box inline-block">Box 3</div>
        </section>
        <section class="display-section">
            <h2>Display None</h2>
            <p class="hide">
                This paragraph is hidden using display: none;
            </p>
            <p>
                This paragraph is visible.
            </p>
        </section>
    </main>
</body>
</html>
