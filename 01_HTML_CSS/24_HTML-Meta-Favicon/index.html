<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character Encoding -->
    <meta charset="UTF-8">

    <!-- Responsive Website -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Description -->
    <meta name="description" content="Learn HTML Meta Tags and Favicon.">

    <!-- SEO Keywords -->
    <meta name="keywords" content="HTML, CSS, Meta Tags, Favicon">

    <!-- Author -->
    <meta name="author" content="Abhay Shukla">

    <!-- Browser Tab Icon -->
    <link rel="icon" href="images/favicon.png" type="image/png">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <title>HTML Meta Tags & Favicon</title>
</head>
<body>
    <section>
        <div class="header">
            <h1>HTML META TAGS & FAVICON</h1>
            <p>
                Meta tags provide information about
                a webpage, while favicon is the small
                icon displayed in the browser tab.
            </p>
        </div>
        <div class="content">
            <h2>Meta Tags</h2>
            <p>
                Meta tags help browsers and search engines
                understand your webpage.
            </p>
            <h2>Favicon</h2>
            <p>
                A favicon is the small icon shown
                beside the webpage title.
            </p>
        </div>
    </section>
</body>
</html>
