<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Classes & IDs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <div class="header">
            <h1 id="main-heading">HTML CLASSES & IDs</h1>
            <p class="description">
                Classes and IDs are used to identify
                and style HTML elements.
            </p>
        </div>
        <div class="content">
            <h2 class="title">HTML Class</h2>
            <p class="text">
                A class can be used on multiple HTML elements.
            </p>
            <p class="text">
                All elements having the same class receive the same CSS styles.
            </p>
            <h2 class="title">HTML ID</h2>
            <p id="unique-text">
                An ID should be unique within a webpage.
            </p>
        </div>
    </section>
</body>
</html>
