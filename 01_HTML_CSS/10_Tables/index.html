<!DOCTYPE html>
<html lang='en'>
<head>

    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>HTML TABLES</title>
    <link rel='stylesheet' href='style.css'>
</head>
<body>

                <tr>
                    <th>Name</th>

                    <td>CU UP</td>
                </tr>
                <tr>
                    <td>Rahul</td>
                    <td>BCA</td>
                    <td>2nd</td>
                    <td>CU UP</td>
                </tr>
                <tr>
                    <td>Priya</td>
                    <td>B.Tech</td>
                    <td>1st</td>
                    <td>CU UP</td>
                </tr>
                <tr>
                    <td>Rohit</td>
                    <td>BCA</td>
                    <td>1st</td>
                    <td>CU UP</td>
                </tr>
            </table>
        </div>
    </section>
    
</body>
</html>
