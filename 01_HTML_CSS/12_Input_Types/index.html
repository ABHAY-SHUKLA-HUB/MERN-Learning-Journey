<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>HTML INPUT TYPES</title>
    <link rel='stylesheet' href='style.css'>
</head>

<body>
    <section>
        <div class="header">
            <h1>HTML INPUT TYPES</h1>
            <p>HTML provides different input types to collect different kinds of user information.</p>
        </div>
        <div class="input-type">
            <form action="" method="post">
                <label for="name">Name</label><br>
                <input type="text" id="name" name="name" placeholder="Enter Your Name"><br>

                <label for="password">Password</label><br>
                <input type="password" id="password" name="password" placeholder="Enter Your Password"><br>

                <label for="email">Email</label><br>
                <input type="email" id="email" name="email" placeholder="Enter Your Email"><br>

                <label for="number">Number</label><br>
                <input type="tel" id="number" name="number" placeholder="Enter Mobile Number"><br>

                <label for="date">Date</label><br>
                <input type="date" id="date" name="date"><br>

                <label for="time">Time</label><br>
                <input type="time" id="time" name="time"><br>

                <label for="color">Color</label><br>
                <input type="color" id="color" name="color"><br>

                <label for="age">Age</label><br>
                <input type="number" id="age" name="age" placeholder="Enter Your Age"><br>
                <label for="search">Search</label><br>
                <input type="search" id="search" name="search" placeholder="Search Here"><br>
                <label for="website">Website</label><br>
                <input type="url" id="website" name="website" placeholder="https://example.com"><br>

                <label for="resume">Resume</label><br>
                <input type="file" id="resume" name="resume"><br>

                <label for="volume">Volume</label><br>
                <input type="range" id="volume" name="volume"><br>

                <label>Gender</label><br>

                <input type="radio" id="male" name="gender">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender">
                <label for="female">Female</label><br>

                <label>Skills</label><br>

                <input type="checkbox" id="html" name="skills">
                <label for="html">HTML</label>

                <input type="checkbox" id="css" name="skills">
                <label for="css">CSS</label><br>

                <input type="submit" value="Submit">
                <input type="reset" value="Reset">


            </form>
        </div>
    </section>
</body>

</html>
