<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>HTML ENTITIES</title>
    <link rel='stylesheet' href='style.css'>
</head>

<body>
    <section>
        <div class="header">
            <h1>HTML ENTITIES</h1>
            <p>HTML Entities are used to display
                reserved and special characters.</p>
        </div>
        <div class="entities">
            <h2>Less Than : &lt;</h2>
            <h2>Greater Than : &gt;</h2>

            <h2>Ampersand : &amp;</h2>

            <h2>Copyright : &copy;</h2>

            <h2>Registered : &reg;</h2>

            <h2>Trademark : &trade;</h2>

            <h2>Hello&nbsp;&nbsp;&nbsp;World</h2>

            <h2>Emoji : 😊 🚀 ❤️ 🎉</h2>

        </div>


    </section>
</body>

</html>
