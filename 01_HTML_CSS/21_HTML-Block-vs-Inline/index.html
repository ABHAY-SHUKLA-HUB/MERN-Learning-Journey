<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Block vs Inline Elements</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>HTML BLOCK VS INLINE ELEMENTS</h1>
        <p>
            HTML elements are divided into Block Elements
            and Inline Elements.
        </p>
    </header>
    <main>
        <section>
            <h2>Block Elements</h2>
            <h3>Heading Element</h3>
            <p>
                This is a paragraph element.
            </p>
            <div>
                This is a div element.
            </div>
        </section>
        <section>
            <h2>Inline Elements</h2>
            <a href="#">Google</a>
            <span>HTML</span>
            <strong>CSS</strong>
            <em>JavaScript</em>
        </section>
    </main>
</body>
</html>
