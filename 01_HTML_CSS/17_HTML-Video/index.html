<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>HTML VIDEO</title>
    <link rel='stylesheet' href='style.css'>
</head>
<body>
    <section>
        <div class="header">
            <h1>HTML VIDEO</h1>
            <p>Videos allow users to watch media
            directly on a webpage.</p>
        </div>
        <div class="video">
            <video controls>
                <source src="video/demo.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </section>
</body>
</html>



<!-- 📚 Important Attributes

1️⃣ controls

Shows

Play
Pause
Timeline
Volume
Fullscreen
<video controls>

2️⃣ autoplay

Automatically starts video.

<video autoplay>

⚠ Modern browsers generally allow autoplay only when the video is muted.

3️⃣ loop

Video repeats forever.

<video loop>

4️⃣ muted

Starts without sound.

<video muted>

5️⃣ poster

Shows an image before the video starts.

<video controls poster="images/poster.jpg">
    
6️⃣ controls + loop

<video controls loop>
    
7️⃣ controls + autoplay + muted
<video controls autoplay muted> -->
