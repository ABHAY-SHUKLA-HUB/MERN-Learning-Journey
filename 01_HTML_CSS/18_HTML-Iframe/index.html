<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML IFRAME</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <div class="header">
            <h1>HTML IFRAME</h1>
            <p>
                Iframe allows you to embed another
                webpage or content inside your webpage.
            </p>
        </div>
        <div class="iframe-container">
            <h2>YouTube Video</h2>
            <iframe width="560"
                height="315"
                src="https://www.youtube.com/embed/KMgcEOl7csY?si=VTmJ_JtsbBOx41PT"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </iframe>
        </div>
        <div class="iframe-container">
            <h2>Google Map</h2>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3455.5103946207785!2d76.81880927501255!3d30.76872338355924!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390fed76a7f8db59%3A0x6e1f7e0f7d5ef0d0!2sChandigarh%20University!5e0!3m2!1sen!2sin!4v1750000000000"
                width="560" height="315" title="Google Map" loading="lazy">
            </iframe>
        </div>
    </section>
</body>
</html>
